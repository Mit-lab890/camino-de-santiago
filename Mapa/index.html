<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Camino de Santiago 2026o</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Elevation CSS (Estilo moderno y limpio) -->
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
        }
        /* El mapa ocupa toda la pantalla de fondo */
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Personalización de los popups de las etapas (waypoints) para que sean elegantes */
        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .leaflet-popup-tip {
            background: #222;
        }
    </style>
</head>
<body>

    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Elevation JS -->
    <script src="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.js"></script>

    <script>
        // 1. Inicializar el mapa centrado en España
        var map = L.map('map', {
            center: [42.5, -8.0], // Coordenadas orientativas hacia el norte/camino en España
            zoom: 7,
            zoomControl: true
        });

        // 2. Capa base de Satélite de alta calidad (Esri World Imagery)
        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Capa de etiquetas de carreteras y poblaciones superpuesta al satélite
        var labelsLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // 3. Configuración avanzada del panel de elevación estilo gpx.studio
        var controlElevation = L.control.elevation({
            theme: "elevation-theme-modern", // Estilo limpio y plano
            detached: true,                  // Panel flotante inferior idéntico a gpx.studio
            elevationDiv: "#elevation-div",  // Se crea automáticamente si no existe
            followMarker: true,              // Sincronización ratón-mapa
            autohide: false,
            summary: "inline",               // Muestra resumen de datos (desniveles, distancias)
            legend: true,                    // Muestra la leyenda de colores por pendiente
            speed: true,
            slope: "grade",
            waypoints: true,                 // Habilita la lectura de Waypoints (etapas)
            trk: true,                       // Habilita los Tracks principales
            rt: true,                        // Habilita Routes
            pts: false,                      // 🚫 FUERZA A OCULTAR LOS TRACK-POINTS individuales
            gpxOptions: {
                polyline_options: {
                    weight: 5,
                    opacity: 0.9,
                    lineCap: 'round'
                },
                marker_options: {
                    startIcon: null,         // Oculta iconos predeterminados feos para usar los limpios
                    endIcon: null,
                    wptIcon: L.divIcon({     // Estilo elegante tipo punto de etapa para tus Waypoints
                        className: 'custom-waypoint-icon',
                        html: '<div style="background-color: #3b82f6; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.6);"></div>',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }
            }
        });

        controlElevation.addTo(map);

        // 4. Cargar el archivo GPX aplicando el coloreado por pendiente de dificultad
        controlElevation.load("ruta.gpx");

        // Estilo dinámico inyectado para colorear la traza según la dificultad/pendiente (Estilo gpx.studio)
        var cssGpxStudio = document.createElement("style");
        cssGpxStudio.innerHTML = `
            .elevation-polyline {
                stroke-linecap: round;
            }
        `;
        document.head.appendChild(cssGpxStudio);

    </script>
</body>
</html>
