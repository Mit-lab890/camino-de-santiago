<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruta con Komoot</title>
    
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        /* Contenedor del mapa (ocupa gran parte de la pantalla) */
        #map {
            width: 100%;
            height: 70vh;
        }
        .info {
            padding: 1rem;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Ruta de Komoot</h1>
    </header>

    <!-- Div donde se renderizará el mapa -->
    <div id="map"></div>
    
    <div class="info">
        <p>Comparte este enlace con tus amigos para que vean el recorrido.</p>
    </div>

    <!-- Librería Leaflet y Plugin Leaflet-GPX -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Inicializar el mapa centrado en cualquier sitio (se reajustará solo con el GPX)
        var map = L.map('map').setView([0, 0], 13);

        // 2. Añadir capa de mapa base (OpenStreetMap gratuito)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Ruta a tu archivo GPX (Sube tu archivo a la misma carpeta en GitHub y pon aquí su nombre)
        var gpxUrl = 'ruta.gpx'; 

        // 4. Cargar el GPX en el mapa y ajustar la vista automáticamente
        new L.GPX(gpxUrl, {
            async: true,
            marker_options: {
                startIcon: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-start.png',
                endIcon: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-end.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-shadow.png'
            }
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);
    </script>

</body>
</html>
