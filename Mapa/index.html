<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camino de Santiago 2026</title>
    
    <!-- Librerías Externas CSS (Leaflet y FontAwesome) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Tus Estilos -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <!-- Título flotante -->
    <div class="map-title">
        <i class="fa-solid fa-route"></i> Camino de Santiago 2026
    </div>

    <!-- Mapa a pantalla completa -->
    <div id="map"></div>
    
    <!-- Botones flotantes -->
    <div class="toolbar">
        <button class="btn-tool" id="btn-elevation" title="Ver Perfil de Elevación">
            <i class="fa-solid fa-chart-area"></i>
        </button>
        <button class="btn-tool" id="btn-team" title="Ver Integrantes">
            <i class="fa-solid fa-users"></i>
        </button>
        <!-- Dejo preparado un botón para el futuro feedback -->
        <button class="btn-tool" id="btn-feedback" title="Añadir Feedback" style="display: none;">
            <i class="fa-solid fa-comment-dots"></i>
        </button>
    </div>

    <!-- Panel Retráctil de Elevación -->
    <div id="elevation-container">
        <button class="close-panel-btn" id="close-elevation" title="Cerrar">
            <i class="fa-solid fa-times"></i>
        </button>
        <div id="elevation-div"></div>
    </div>

    <!-- Modal de Integrantes -->
    <div class="modal-overlay" id="team-overlay">
        <div class="team-modal">
            <button class="close-panel-btn" id="close-team" style="top: 15px; right: 15px;" title="Cerrar">
                <i class="fa-solid fa-times"></i>
            </button>
            <h2><i class="fa-solid fa-shoe-prints"></i> Los 8 Peregrinos</h2>
            <div class="team-grid" id="team-grid">
                <!-- Se rellena automáticamente por JavaScript -->
            </div>
        </div>
    </div>

    <!-- Librerías Externas JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.js"></script>

    <!-- Tus Scripts -->
    <!-- <script src="js/db.js"></script> Lo activaremos cuando pongamos Firebase -->
    <script src="js/main.js"></script>
    
</body>
</html>
