<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruta en España - Satélite</title>
    
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        header {
            background: #111;
            padding: 0.8rem;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        /* Contenedor del mapa */
        #map {
            width: 100%;
            height: 80vh;
        }
        .info {
            padding: 0.8rem;
            text-align: center;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h2>Ruta Camino de Santiago</h2>
    </header>

    <!-- Div donde se renderizará el mapa -->
    <div id="map"></div>
    
    <div class="info">
        <p>Mapa vía Esri Satellite.</p>
    </div>

    <!-- Librerías de Leaflet y Plugin GPX -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Inicializar el mapa centrado DIRECTAMENTE EN ESPAÑA (Coordenadas aproximadas del centro: Madrid, zoom 6)
        var map = L.map('map').setView([40.4168, -3.7038], 6);

        // 2. Añadir CAPA DE SATÉLITE de alta resolución (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }).addTo(map);

        // 3. Capa adicional opcional con etiquetas de carreteras/ciudades sobre el satélite (Esri Reference Overlay)
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // 4. Cargar tu archivo GPX (Asegúrate de subir tu archivo a GitHub con este mismo nombre)
        var gpxUrl = 'ruta.gpx'; 

        var gpxLayer = new L.GPX(gpxUrl, {
            async: true,
            marker_options: {
                startIcon: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-start.png',
                endIcon: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-icon-end.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/pin-shadow.png'
            },
            polyline_options: {
                color: '#ff0055', // Color fucsia/rojo brillante para que resalte perfectamente sobre el satélite
                weight: 4,
                opacity: 0.8
            }
        }).on('loaded', function(e) {
            // Al cargar la ruta, el mapa hace zoom automáticamente sobre ella (centrándose en tu zona de España)
            map.fitBounds(e.target.getBounds());
        }).addTo(map);

    </script>

</body>
</html>
