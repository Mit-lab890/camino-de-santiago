<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camino de Santiago 2026/title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Elevation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.css" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 1. Contenedor superior para el mapa de satélite (ocupa todo el espacio disponible) */
        #map {
            flex: 1;
            width: 100%;
            background: #000;
        }
        /* 2. Contenedor inferior independiente para el perfil de altitud (Fondo negro y diseño limpio) */
        #elevation-div {
            height: 220px;
            width: 100%;
            background-color: #121212;
            border-top: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        /* Ocultar cualquier elemento residual de puntos de track por seguridad */
        .leaflet-marker-icon.track-point {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Mapa de Satélite -->
    <div id="map"></div>
    
    <!-- Panel de Elevación Separado (Fondo negro elegante, sin solapamiento) -->
    <div id="elevation-div"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Elevation JS -->
    <script src="https://unpkg.com/@raruto/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.js"></script>

    <script>
        // 1. Inicializar el mapa centrado en la zona de la ruta
        var map = L.map('map', {
            center: [42.5, -8.0],
            zoom: 7,
            zoomControl: true
        });

        // 2. Capa base de Satélite de alta calidad (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Capa de etiquetas de poblaciones sobre el satélite
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // 3. Configuración estricta del panel de elevación y filtrado de puntos
        var controlElevation = L.control.elevation({
            theme: "dark-theme",          // Tema oscuro integrado
            detached: true,               // Separa el gráfico mandándolo a su propio div inferior
            elevationDiv: "#elevation-div", 
            followMarker: true,           // Sincronización en tiempo real ratón-mapa
            autohide: false,
            summary: true,                // Muestra totales de distancia y desnivel
            legend: true,                 // Leyenda de colores por pendiente
            slope: "grade",
            waypoints: true,              // SÍ permite mostrar los waypoints (etapas)
            trk: true,                    // SÍ muestra el track principal
            pts: false,                   // 🚫 BLOQUEA los track-points individuales para que no aparezcan
            gpxOptions: {
                polyline_options: {
                    weight: 4,
                    opacity: 0.9,
                    lineCap: 'round'
                },
                marker_options: {
                    startIcon: null,      // Oculta icono de inicio genérico
                    endIcon: null,        // Oculta icono de fin genérico
                    point_icon: null,     // Bloquea los puntos del track
                    wptIcon: L.divIcon({  // Estilo limpio y elegante exclusivo para las etapas (waypoints)
                        className: 'custom-waypoint',
                        html: '<div style="background-color: #3b82f6; width: 14px; height: 14px; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.7);"></div>',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }
            }
        });

        controlElevation.addTo(map);

        // 4. Cargar el archivo GPX asegurando que esté en la misma carpeta del repositorio
        controlElevation.load("ruta.gpx");
    </script>
</body>
</html>
